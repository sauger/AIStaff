<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 122" fill="none" aria-hidden="true" class="work-laptop">
 <defs>
  <linearGradient id="workLidBack" x1="61" y1="61.6" x2="61" y2="104" gradientUnits="userSpaceOnUse">
   <stop stop-color="#FCFDFE"/>
   <stop offset=".5" stop-color="#EEF2F6"/>
   <stop offset="1" stop-color="#D7DEE6"/>
  </linearGradient>
  <linearGradient id="workThinEdge" x1="61" y1="103.6" x2="61" y2="105.2" gradientUnits="userSpaceOnUse">
   <stop stop-color="#EEF2F6"/>
