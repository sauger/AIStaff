   <circle cx="61" cy="82.6" r="2.4" fill="#C5CFD9"/>
   <circle cx="61" cy="82.6" r="2.4" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width=".45"/>
   <!-- 屏幕与底座的转轴缝 + 两侧铰链 -->
   <path d="M30.6 103.4H91.4" stroke="#C6D0DA" stroke-opacity=".5" stroke-width=".5"/>
   <path d="M30.6 102.2H91.4" stroke="#FFFFFF" stroke-opacity=".7" stroke-width=".6"/>
  </g>
 </g>
</svg>
